<div
  class="ul-search-select ul-search-select--{{ size() }}"
  [class.ul-search-select--open]="combobox.isOpen()"
  [class.ul-search-select--error]="hasError()"
  [class.ul-search-select--disabled]="disabled()"
  [class.ul-search-select--required]="required()"
  [attr.aria-invalid]="hasError()"
  [attr.aria-required]="required()"
  [attr.aria-describedby]="describedBy()"
>
  <ul-form-field-label
    [label]="label()"
    [required]="required()"
    [for]="ids.controlId"
    [size]="size()"
    [showRequiredIndicator]="showRequiredIndicator()"
  />

  <div
    class="ul-search-select__control"
    [class.ul-search-select__control--focused]="combobox.isFocused()"
    role="combobox"
    [attr.aria-expanded]="combobox.isOpen()"
    [attr.aria-controls]="listId"
    [attr.aria-activedescendant]="activeDescendantId()"
    (keydown)="onKeydown($event)"
  >
    <ul-input
      [controlId]="ids.controlId"
      [value]="displayText()"
      (valueChange)="onInputValueChange($event)"
      (inputFocus)="onInputFocus()"
      (inputBlur)="onInputBlur()"
      [size]="size()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      [label]="null"
      [helperText]="null"
      [autocomplete]="'off'"
    >
      <ng-container ul-input-right-elements>
        <ul-icon size="5" icon="search" />
      </ng-container>
    </ul-input>

    @if (shouldShowPanel()) {
      <div
        class="ul-search-select__list ul-scrollable"
        [class.ul-search-select__list--empty]="hasNoResults()"
        [id]="listId"
        role="listbox"
      >
        @if (hasNoResults()) {
          <div class="ul-search-select__empty" role="status">No results</div>
        } @else {
          @for (opt of filteredOptions(); track opt.value; let i = $index) {
            <div
              class="ul-search-select__option"
              [class.ul-search-select__option--highlighted]="combobox.highlightedIndex() === i"
              [id]="optionId(i)"
              role="option"
              [attr.aria-selected]="value() === opt.value"
              (mousedown)="selectOption(opt)"
            >
              <ul-list-item
                theme="ghost-white"
                [selected]="value() === opt.value"
                [hideFocusOutline]="true"
              >
                <ng-container ul-list-item-label>{{ opt.label }}</ng-container>
              </ul-list-item>
            </div>
          }
        }
      </div>
    }
  </div>

  <ul-form-field-helper
    [id]="ids.helperId"
    [helperText]="helperText()"
    [errorText]="errorText() || (hasError() && errors().length ? errors()[0].message : '') || null"
    [error]="hasError()"
  />
</div>
